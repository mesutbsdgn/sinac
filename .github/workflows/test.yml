name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: poppler (gerçek PDF testleri için)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: testler
        run: |
          for t in scripts/test_*.py; do python3 -B "$t" || exit 1; done
